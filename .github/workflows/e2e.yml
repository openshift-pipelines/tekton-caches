name: build-test-publish
permissions:
  contents: read

on:
  pull_request:
    branches: [main, "release-v*"]
  push:
    branches: [main, "release-v*"]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: "Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)"
        required: false
        default: false


jobs:


  e2e:
    name: e2e tests
    runs-on: ubuntu-latest
    env:
        KUBECONFIG: /home/runner/.kube/config.kind
    steps:
      - uses: ko-build/setup-ko@v0.9
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.1
      - uses: azure/setup-helm@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        with:
          limit-access-to-actor: true
          detached: true

      - name: Install kind
        run: |
          set -euxfo pipefail
          ./hack/kind-install.sh

      - name: tests
        run: |
          set -euxfo pipefail

          REGISTRY=registry.registry.svc.cluster.local:32222
          KO_DOCKER_REPO=localhost:5000/tekton-caches
          IMAGE_REF="${KO_DOCKER_REPO}/cache:$(git rev-parse HEAD | tr -d '\n')"
          
          #FIXME Disabling e2e as there seems to be some issue
          make e2e
          
